apiVersion: v1
kind: Service
metadata:
  name: {{ include "estimate-form.frontend.fullname" . }}
  labels:
    {{- include "estimate-form.labels" . | nindent 4 }}
    {{- include "estimate-form.componentLabels" (dict "component" "frontend") | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
    {{- if .Values.frontend.nginx.metrics.enabled }}
    - name: metrics
      port: 9113
      targetPort: metrics
      protocol: TCP
    {{- end }}
  selector:
    {{- include "estimate-form.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
