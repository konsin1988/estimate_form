apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "estimate-form.frontend.fullname" . }}-nginx-config
  labels:
    {{- include "estimate-form.labels" . | nindent 4 }}
    {{- include "estimate-form.componentLabels" (dict "component" "frontend") | nindent 4 }}
data:
  default.conf: |
    server {
        listen 80;

        root /usr/share/nginx/html;
        index index.html;

        client_max_body_size {{ .Values.frontend.nginx.clientMaxBodySize }};

        location /api/ {
            proxy_pass http://{{ include "estimate-form.backend.fullname" . }}:{{ .Values.backend.service.port }}/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout {{ .Values.frontend.nginx.proxyTimeoutSeconds }}s;
            proxy_send_timeout {{ .Values.frontend.nginx.proxyTimeoutSeconds }}s;
        }

        {{- if .Values.frontend.nginx.metrics.enabled }}
        # Instrumentation endpoint for the nginx-prometheus-exporter sidecar
        # (localhost only, not reachable from outside the pod).
        location = /nginx_status {
            stub_status;
            allow 127.0.0.1;
            allow ::1;
            deny all;
        }
        {{- end }}

        location / {
            try_files $uri /index.html;
        }
    }
