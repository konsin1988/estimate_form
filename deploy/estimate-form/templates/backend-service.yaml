apiVersion: v1
kind: Service
metadata:
  name: {{ include "estimate-form.backend.fullname" . }}
  labels:
    {{- include "estimate-form.labels" . | nindent 4 }}
    {{- include "estimate-form.componentLabels" (dict "component" "backend") | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "estimate-form.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
