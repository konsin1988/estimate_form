{{- if not .Values.backend.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "estimate-form.backend.fullname" . }}-secret
  labels:
    {{- include "estimate-form.labels" . | nindent 4 }}
    {{- include "estimate-form.componentLabels" (dict "component" "backend") | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.backend.postgres.viaSecret }}
  {{- with required "backend.postgres.serviceFile is required (pg_service.conf content with the [revenue] section) when backend.postgres.viaSecret=true. Alternatively set backend.existingSecret or viaSecret=false." .Values.backend.postgres.serviceFile }}
  pg-service.conf: |-
{{ . | replace "\r" "" | indent 4 }}
  {{- end }}
  {{- with required "backend.postgres.pgpass is required (libpq password file content) when backend.postgres.viaSecret=true. Alternatively set backend.existingSecret or viaSecret=false." .Values.backend.postgres.pgpass }}
  pg-pass: |-
{{ . | replace "\r" "" | indent 4 }}
  {{- end }}
  {{- end }}
  secret-key: {{ required "backend.secret.secretKey is required (Django SECRET_KEY). Alternatively set backend.existingSecret." .Values.backend.secret.secretKey | quote }}
  encrypt-key: {{ required "backend.secret.encryptKey is required (AES key for user identity decryption). Alternatively set backend.existingSecret." .Values.backend.secret.encryptKey | quote }}
  iv: {{ required "backend.secret.iv is required (AES IV for user identity decryption). Alternatively set backend.existingSecret." .Values.backend.secret.iv | quote }}
  db-name: {{ .Values.backend.secret.db.name | quote }}
  db-user: {{ .Values.backend.secret.db.user | quote }}
  db-password: {{ .Values.backend.secret.db.password | quote }}
  db-host: {{ .Values.backend.secret.db.host | quote }}
  db-port: {{ .Values.backend.secret.db.port | quote }}
{{- end }}
