{{- if .Values.monitoring.grafana.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "estimate-form.fullname" . }}-grafana-dashboard
  labels:
    {{- include "estimate-form.labels" . | nindent 4 }}
    {{- with .Values.monitoring.grafana.dashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.monitoring.grafana.dashboard.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  estimate-form-overview.json: |
    {
      "uid": "estimate-form-overview",
      "title": "Estimate Form / Overview",
      "description": "Request rate, latency, errors, nginx connections and pod resources for the estimate-form application. Metrics: django-prometheus (/metrics), nginx-prometheus-exporter, cAdvisor, kube-state-metrics; logs via Loki.",
      "tags": ["estimate-form"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "DS",
            "label": "Prometheus datasource",
            "type": "datasource",
            "query": { "query": "prometheus" },
            "current": { "selected": false, "text": "Prometheus", "value": "Prometheus" },
            "hide": 0
          },
          {
            "name": "LOKI",
            "label": "Loki datasource",
            "type": "datasource",
            "query": { "query": "loki" },
            "current": { "selected": false, "text": "Loki", "value": "Loki" },
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Backend: HTTP request rate by view",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "fieldConfig": {
            "defaults": { "unit": "reqps", "custom": { "fillOpacity": 10 } },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "table", "placement": "right", "calcs": ["lastNotNull"] } },
          "targets": [
            {
              "expr": "sum by (view) (rate(django_http_requests_total_by_view_transport_method_total{namespace=\"{{ .Release.Namespace }}\", pod=~\"{{ include "estimate-form.fullname" . }}-backend-.*\"}[$__rate_interval]))",
              "legendFormat": "{{`{{view}}`}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Backend: HTTP 4xx / 5xx response rate",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "fieldConfig": {
            "defaults": { "unit": "reqps", "custom": { "fillOpacity": 10 } },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "expr": "sum(rate(django_http_responses_total_by_status_total{namespace=\"{{ .Release.Namespace }}\", pod=~\"{{ include "estimate-form.fullname" . }}-backend-.*\", status=~\"5..\"}[$__rate_interval]))",
              "legendFormat": "5xx",
              "refId": "A"
            },
            {
              "expr": "sum(rate(django_http_responses_total_by_status_total{namespace=\"{{ .Release.Namespace }}\", pod=~\"{{ include "estimate-form.fullname" . }}-backend-.*\", status=~\"4..\"}[$__rate_interval]))",
              "legendFormat": "4xx",
              "refId": "B"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Backend: request latency p50 / p95 (all views)",
          "description": "Computed from django_http_requests_latency_seconds_by_view_method (django-prometheus).",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "fieldConfig": {
            "defaults": { "unit": "s", "custom": { "fillOpacity": 10 } },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "table", "placement": "right", "calcs": ["lastNotNull"] } },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(django_http_requests_latency_seconds_by_view_method_bucket{namespace=\"{{ .Release.Namespace }}\", pod=~\"{{ include "estimate-form.fullname" . }}-backend-.*\"}[5m])))",
              "legendFormat": "p95",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.50, sum by (le) (rate(django_http_requests_latency_seconds_by_view_method_bucket{namespace=\"{{ .Release.Namespace }}\", pod=~\"{{ include "estimate-form.fullname" . }}-backend-.*\"}[5m])))",
              "legendFormat": "p50",
              "refId": "B"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Backend: database statements / s",
          "description": "django_db_execute_total by database alias (fin = PostgreSQL forecast tables).",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "fieldConfig": {
            "defaults": { "unit": "ops", "custom": { "fillOpacity": 10 } },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "expr": "sum by (alias) (rate(django_db_execute_total{namespace=\"{{ .Release.Namespace }}\", pod=~\"{{ include "estimate-form.fullname" . }}-backend-.*\"}[$__rate_interval]))",
              "legendFormat": "{{`{{alias}}`}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Backend: exceptions / s by view",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "fieldConfig": {
            "defaults": { "unit": "ops", "custom": { "fillOpacity": 10 }, "color": { "mode": "palette-classic" } },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "expr": "sum by (view) (rate(django_http_exceptions_total_by_view_total{namespace=\"{{ .Release.Namespace }}\", pod=~\"{{ include "estimate-form.fullname" . }}-backend-.*\"}[$__rate_interval]))",
              "legendFormat": "{{`{{view}}`}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Backend: database errors / s",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "fieldConfig": {
            "defaults": { "unit": "ops", "custom": { "fillOpacity": 10 } },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "expr": "sum by (type) (rate(django_db_errors_total{namespace=\"{{ .Release.Namespace }}\", pod=~\"{{ include "estimate-form.fullname" . }}-backend-.*\"}[$__rate_interval]))",
              "legendFormat": "query: {{`{{type}}`}}",
              "refId": "A"
            },
            {
              "expr": "sum by (alias) (rate(django_db_new_connection_errors_total{namespace=\"{{ .Release.Namespace }}\", pod=~\"{{ include "estimate-form.fullname" . }}-backend-.*\"}[$__rate_interval]))",
              "legendFormat": "conn: {{`{{alias}}`}}",
              "refId": "B"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Frontend: nginx active connections",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 },
          "fieldConfig": {
            "defaults": { "unit": "short", "custom": { "fillOpacity": 20 } },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "expr": "nginx_connections_active{namespace=\"{{ .Release.Namespace }}\", pod=~\"{{ include "estimate-form.fullname" . }}-frontend-.*\"}",
              "legendFormat": "{{`{{pod}}`}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Frontend: nginx requests / s",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 24 },
          "fieldConfig": {
            "defaults": { "unit": "reqps", "custom": { "fillOpacity": 10 } },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "expr": "sum by (pod) (rate(nginx_http_requests_total{namespace=\"{{ .Release.Namespace }}\", pod=~\"{{ include "estimate-form.fullname" . }}-frontend-.*\"}[$__rate_interval]))",
              "legendFormat": "{{`{{pod}}`}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Pods: CPU usage (cores)",
          "description": "cAdvisor metric container_cpu_usage_seconds_total.",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 32 },
          "fieldConfig": {
            "defaults": { "unit": "none", "custom": { "fillOpacity": 10 } },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "table", "placement": "right", "calcs": ["lastNotNull"] } },
          "targets": [
            {
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"{{ .Release.Namespace }}\", pod=~\"(?:{{ include "estimate-form.fullname" . }}-backend-.*|{{ include "estimate-form.fullname" . }}-frontend-.*)\", container!=\"\"}[$__rate_interval]))",
              "legendFormat": "{{`{{pod}}`}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Pods: memory working set",
          "description": "cAdvisor metric container_memory_working_set_bytes.",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 32 },
          "fieldConfig": {
            "defaults": { "unit": "bytes", "custom": { "fillOpacity": 10 } },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "table", "placement": "right", "calcs": ["lastNotNull"] } },
          "targets": [
            {
              "expr": "container_memory_working_set_bytes{namespace=\"{{ .Release.Namespace }}\", pod=~\"(?:{{ include "estimate-form.fullname" . }}-backend-.*|{{ include "estimate-form.fullname" . }}-frontend-.*)\", container!=\"\"}",
              "legendFormat": "{{`{{pod}}`}} / {{`{{container}}`}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Pods: container restarts",
          "description": "Requires kube-state-metrics (part of kube-prometheus-stack).",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 40 },
          "fieldConfig": {
            "defaults": { "unit": "short", "custom": { "fillOpacity": 0, "drawStyle": "line", "lineInterpolation": "stepAfter" } },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "expr": "kube_pod_container_status_restarts_total{namespace=\"{{ .Release.Namespace }}\", pod=~\"(?:{{ include "estimate-form.fullname" . }}-backend-.*|{{ include "estimate-form.fullname" . }}-frontend-.*)\"}",
              "legendFormat": "{{`{{pod}}`}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 12,
          "type": "logs",
          "title": "Logs (Loki)",
          "description": "Application logs collected by Promtail/Alloy from container stdout. LogQL examples for ad-hoc queries: {namespace=\"{{ .Release.Namespace }}\", pod=~\".*backend.*\"} | json | level=\"ERROR\".",
          "datasource": { "type": "loki", "uid": "${LOKI}" },
          "gridPos": { "h": 14, "w": 12, "x": 12, "y": 40 },
          "fieldConfig": { "defaults": {}, "overrides": [] },
          "options": { "showTime": true, "showLabels": true, "showCommonLabels": false, "wrapLogMessage": true, "prettifyLogMessage": false, "enableLogDetails": true, "sortOrder": "Descending" },
          "targets": [
            {
              "expr": "{namespace=\"{{ .Release.Namespace }}\", pod=~\"(?:{{ include "estimate-form.fullname" . }}-backend-.*|{{ include "estimate-form.fullname" . }}-frontend-.*)\"}",
              "refId": "A"
            }
          ]
        }
      ]
    }
{{- end }}
